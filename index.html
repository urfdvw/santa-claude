<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Santa Claude </title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js"
  ></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pine:   #0d3320;
      --forest: #1a5c38;
      --holly:  #c41e3a;
      --gold:   #d4a017;
      --cream:  #fdf8f0;
      --snow:   #ffffff;
      --shadow: rgba(0,0,0,.45);
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background: var(--pine);
      background-image:
        radial-gradient(ellipse at 20% 0%,  #1e6640 0%, transparent 55%),
        radial-gradient(ellipse at 80% 100%, #0a2818 0%, transparent 50%);
      font-family: 'Inter', sans-serif;
      color: var(--snow);
      overflow-x: hidden;
    }

    #snow-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 3.5rem 1rem 2.5rem;
    }

    .star-row {
      display: flex;
      justify-content: center;
      gap: 1.4rem;
      margin-bottom: 1rem;
      opacity: .75;
    }
    .star-row span {
      font-size: 1.1rem;
      color: var(--gold);
      animation: twinkle 2.4s ease-in-out infinite;
    }
    .star-row span:nth-child(2) { animation-delay: .4s; }
    .star-row span:nth-child(3) { animation-delay: .8s; }
    .star-row span:nth-child(4) { animation-delay: 1.2s; }
    .star-row span:nth-child(5) { animation-delay: 1.6s; }

    @keyframes twinkle {
      0%, 100% { opacity: .6; transform: scale(1); }
      50%       { opacity: 1;  transform: scale(1.3); }
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3.8rem);
      letter-spacing: .04em;
      background: linear-gradient(135deg, var(--gold) 0%, #ffe87c 45%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 2px 8px rgba(212,160,23,.4));
    }

    .ribbon {
      display: inline-block;
      margin-top: 1rem;
      height: 3px;
      width: clamp(120px, 30vw, 320px);
      background: linear-gradient(90deg, transparent, var(--holly), var(--gold), var(--holly), transparent);
      border-radius: 2px;
    }

    .ornament-bar {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      gap: clamp(.6rem, 2vw, 1.4rem);
      padding: .5rem 1rem 2rem;
    }

    .orb {
      width: 18px; height: 18px;
      border-radius: 50%;
      border-top: 3px solid var(--gold);
      box-shadow: 0 4px 10px var(--shadow);
      animation: swing 3s ease-in-out infinite;
    }
    .orb:nth-child(odd)  { animation-delay: .5s; }
    .orb:nth-child(1)  { background: radial-gradient(circle at 35% 30%, #ff8080, var(--holly)); }
    .orb:nth-child(2)  { background: radial-gradient(circle at 35% 30%, #80d4a0, #1a6e40); width:22px;height:22px; }
    .orb:nth-child(3)  { background: radial-gradient(circle at 35% 30%, #ffd770, var(--gold)); }
    .orb:nth-child(4)  { background: radial-gradient(circle at 35% 30%, #ff8080, var(--holly)); width:14px;height:14px; }
    .orb:nth-child(5)  { background: radial-gradient(circle at 35% 30%, #c0e0ff, #4488bb); }
    .orb:nth-child(6)  { background: radial-gradient(circle at 35% 30%, #ffd770, var(--gold)); width:20px;height:20px; }
    .orb:nth-child(7)  { background: radial-gradient(circle at 35% 30%, #80d4a0, #1a6e40); width:16px;height:16px; }
    .orb:nth-child(8)  { background: radial-gradient(circle at 35% 30%, #ff8080, var(--holly)); }
    .orb:nth-child(9)  { background: radial-gradient(circle at 35% 30%, #c0e0ff, #4488bb); width:22px;height:22px; }
    .orb:nth-child(10) { background: radial-gradient(circle at 35% 30%, #ffd770, var(--gold)); width:14px;height:14px; }

    @keyframes swing {
      0%, 100% { transform: rotate(-4deg); }
      50%       { transform: rotate(4deg); }
    }

    main {
      position: relative;
      z-index: 2;
      max-width: 820px;
      margin: 0 auto 4rem;
      padding: 0 1rem;
    }

    .card {
      background: var(--cream);
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(212,160,23,.3),
        0 8px 40px rgba(0,0,0,.55),
        0 0 80px rgba(12,80,40,.3);
    }

    zero-md { display: block; padding: 2.5rem clamp(1.5rem, 5vw, 3rem); }

    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 1.5rem 1rem 2.5rem;
      font-size: .8rem;
      color: rgba(255,255,255,.4);
    }
    footer .dots { display: flex; justify-content: center; gap: .5rem; margin-bottom: .8rem; }
    footer .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--holly); opacity: .6; }
    footer .dots span:nth-child(even) { background: var(--gold); }
  </style>
</head>
<body>

<canvas id="snow-canvas"></canvas>

<header>
  <div class="star-row" aria-hidden="true">
    <span>✦</span><span>✧</span><span>✦</span><span>✧</span><span>✦</span>
  </div>
  <h1>Santa Claude  ٭</h1>
  <div class="ribbon" aria-hidden="true"></div>
</header>

<div class="ornament-bar" aria-hidden="true">
  <div class="orb"></div><div class="orb"></div><div class="orb"></div>
  <div class="orb"></div><div class="orb"></div><div class="orb"></div>
  <div class="orb"></div><div class="orb"></div><div class="orb"></div>
  <div class="orb"></div>
</div>

<main>
  <div class="card">
    <zero-md src="README.md">
      <template>
        <style>
          * { box-sizing: border-box; }
          :host { color: #1a1a1a; }
          h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
            color: #0d3320;
            margin: 1.8rem 0 .7rem;
            line-height: 1.25;
          }
          h1 { font-size: 2.2rem; border-bottom: 3px solid #c41e3a; padding-bottom: .4rem; }
          h2 { font-size: 1.6rem; border-bottom: 1px solid #d4a01740; padding-bottom: .3rem; }
          h3 { font-size: 1.2rem; color: #1a5c38; }
          p  { line-height: 1.75; margin: .9rem 0; color: #2a2a2a; }
          a  { color: #1a5c38; text-decoration: underline; text-underline-offset: 3px; }
          a:hover { color: #c41e3a; }
          ul, ol { padding-left: 1.6rem; margin: .8rem 0; }
          li { margin: .35rem 0; line-height: 1.65; }
          li::marker { color: #c41e3a; }
          blockquote {
            border-left: 4px solid #d4a017;
            background: #fff8e8;
            margin: 1.2rem 0;
            padding: .8rem 1.2rem;
            border-radius: 0 8px 8px 0;
            color: #4a3800;
            font-style: italic;
          }
          code {
            background: #1a5c3818;
            color: #0d3320;
            padding: .15em .4em;
            border-radius: 4px;
            font-size: .9em;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
          }
          pre {
            background: #0d3320;
            color: #d4f0c0;
            border-radius: 10px;
            padding: 1.2rem 1.4rem;
            overflow-x: auto;
            margin: 1.2rem 0;
            border: 1px solid #d4a01730;
          }
          pre code { background: none; color: inherit; padding: 0; }
          table { width: 100%; border-collapse: collapse; margin: 1.2rem 0; }
          th { background: #0d3320; color: #d4a017; padding: .6rem 1rem; text-align: left; }
          td { padding: .55rem 1rem; border-bottom: 1px solid #0d332018; }
          tr:nth-child(even) td { background: #f5ede0; }
          tr:hover td { background: #ffe8e820; }
          hr {
            border: none; height: 2px;
            background: linear-gradient(90deg, transparent, #c41e3a, #d4a017, #c41e3a, transparent);
            margin: 2rem 0;
          }
          img { max-width: 100%; border-radius: 8px; }
          pre::-webkit-scrollbar { height: 6px; }
          pre::-webkit-scrollbar-track { background: #0d3320; }
          pre::-webkit-scrollbar-thumb { background: #d4a017; border-radius: 3px; }
        </style>
      </template>
    </zero-md>
  </div>
</main>

<footer>
  <div class="dots" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <p>And this page as well</p>
</footer>

<script>
  const canvas = document.getElementById('snow-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, flakes = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = document.body.scrollHeight;
  }

  function mkFlake() {
    return {
      x: Math.random() * W,
      y: Math.random() * H - H,
      r: Math.random() * 3 + 1,
      spd: Math.random() * .6 + .3,
      drift: (Math.random() - .5) * .4,
      alpha: Math.random() * .55 + .25,
      wobble: Math.random() * Math.PI * 2,
    };
  }

  function init() {
    resize();
    flakes = Array.from({ length: 160 }, mkFlake);
    flakes.forEach(f => { f.y = Math.random() * H; });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    for (const f of flakes) {
      ctx.globalAlpha = f.alpha;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
      f.y      += f.spd;
      f.x      += f.drift + Math.sin(f.wobble) * .3;
      f.wobble += .02;
      if (f.y > H) { f.y = -f.r * 2; f.x = Math.random() * W; }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init();
  draw();
</script>
</body>
</html>
